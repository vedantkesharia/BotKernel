apiVersion: v1
kind: ConfigMap
metadata:
  name: botkernel-config
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"
  BOTKERNEL_API_URL: "http://api:8000"
  CLOUD_MODE: "mock"
  AWS_DEPLOY_ALLOWED: "false"
  BEDROCK_ENABLED: "false"
  BEDROCK_SPEND_AUTHORIZED: "false"
  AI_ACTION_EXECUTION_ENABLED: "false"
  AGENT_PROVIDER: "deterministic_mock"
  INVESTIGATOR_PROVIDER: "deterministic_mock"
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: botkernel-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: ClusterIP
  selector:
    app: botkernel-dashboard
  ports:
    - port: 8080
      targetPort: 8080
