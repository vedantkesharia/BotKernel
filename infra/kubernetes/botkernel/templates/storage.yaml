{{- $claims := dict "experiments" .Values.storage.experiments }}
{{- if .Values.agents.enabled }}
{{- $_ := set $claims "cost-checkpoint" .Values.storage.checkpoint }}
{{- $_ := set $claims "performance-checkpoint" .Values.storage.checkpoint }}
{{- end }}
{{- range $name, $size := $claims }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: botkernel-{{ $name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $size | quote }}
---
{{- end }}
