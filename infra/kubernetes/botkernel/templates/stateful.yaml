{{- $root := . }}
{{- range $name := list "postgres" "kafka" "redis" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app: botkernel-{{ $name }}
  ports:
    - port: {{ if eq $name "postgres" }}5432{{ else if eq $name "kafka" }}9092{{ else }}6379{{ end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: botkernel-{{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app: botkernel-{{ $name }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: botkernel-{{ $name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- if eq $name "kafka" }}
      securityContext:
        fsGroup: 1000
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- if eq $name "postgres" }}
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: botkernel
            - name: POSTGRES_DB
              value: botkernel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.databaseSecret | quote }}
                  key: postgres-password
          readinessProbe:
            exec:
              command: [pg_isready, -U, botkernel, -d, botkernel]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, botkernel, -d, botkernel]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          {{- else if eq $name "kafka" }}
          image: apache/kafka:3.9.0
          env:
            - {name: KAFKA_LOG_DIRS, value: /tmp/kraft-combined-logs}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 90
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /tmp/kraft-combined-logs
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1024Mi}
          {{- else }}
          image: redis:7-alpine
          command: [redis-server, --appendonly, "yes"]
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ if eq $name "postgres" }}{{ $root.Values.storage.postgres | quote }}{{ else if eq $name "kafka" }}{{ $root.Values.storage.kafka | quote }}{{ else }}{{ $root.Values.storage.redis | quote }}{{ end }}
---
{{- end }}
