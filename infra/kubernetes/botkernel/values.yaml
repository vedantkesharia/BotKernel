# Images must be built locally and loaded into the kind cluster before installation.
backendImage: botkernel-api:local
dashboardImage: botkernel-dashboard:local
imagePullPolicy: IfNotPresent

# Create this Secret out of band with keys postgres-password and database-url.
databaseSecret: botkernel-database
# Existing Secrets, created out of band. Metrics Secret is optional.
operatorSecret: botkernel-operator
agentSecret: botkernel-agent
metricsSecret: botkernel-metrics
investigation:
  maxConcurrent: 2
  executionTimeoutSeconds: 30
  terminationGraceSeconds: 2

bedrock:
  enabled: false
  spendAuthorized: false
  modelId: us.amazon.nova-micro-v1:0
  region: us-east-2
  profile: ""
  maxOutputTokens: 512
  maxCallsPerRun: 1
  maxCallsPerDay: 3
  maxTokensPerDay: 20000
  requestTimeoutSeconds: 10
  agentProvider: deterministic_mock
  investigatorProvider: deterministic_mock

storage:
  postgres: 2Gi
  kafka: 2Gi
  redis: 1Gi
  checkpoint: 1Gi
  experiments: 1Gi

agents:
  # Deterministic agents can submit simulator actions; opt in for a demo.
  enabled: false
  costResource: service-a
  performanceResource: service-b

observability:
  enabled: false
  # Create this ConfigMap from observability/dashboards before enabling this profile.
  dashboardsConfigMap: botkernel-grafana-dashboards
  grafanaAdminSecret: botkernel-grafana-admin
