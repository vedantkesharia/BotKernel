global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: gateway
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [api:8000]
  - job_name: background
    static_configs:
      - targets: [publisher:9100, worker:9100, recovery:9100, controller:9100]
