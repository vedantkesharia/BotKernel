name: local-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p bk-ci up --build -d postgres redis kafka init
      - run: docker compose -p bk-ci --profile test run --build --rm tests
      - run: docker compose -p bk-ci --profile test run --rm tests
      - if: always()
        run: docker compose -p bk-ci down
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
