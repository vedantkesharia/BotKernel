<text class="body" x="888" y="407">Single-node KRaft</text>
<text class="body" x="888" y="430">Action execution topic</text>
<text class="body" x="888" y="453">At-least-once delivery</text>
<text class="body" x="888" y="476">Offsets follow handling</text>
<rect x="1100" y="350" width="300" height="155" rx="12" fill="#fff" stroke="#cbbddf"/>
