<rect x="40" y="630" width="420" height="145" rx="12" fill="#fff" stroke="#cbbddf"/>
<text class="heading" x="58" y="660">Effect graph + deterministic controller</text>
<text class="body" x="58" y="687">Committed, version-ordered effects reveal reversals</text>
<text class="body" x="58" y="710">Selective scale-down holds at admission</text>
<text class="body" x="58" y="733">Sustained verification · recurrence · escalation</text>
<text class="body" x="58" y="756">Evidence indicates correlation, not causal proof</text>
<rect x="510" y="630" width="420" height="145" rx="12" fill="#fff" stroke="#cbbddf"/>
<text class="heading" x="528" y="660">Read-only Incident Investigator</text>
<text class="body" x="528" y="687">Retrieve committed incident/effect evidence</text>
<text class="body" x="528" y="710">Deterministic facts + optional model hypotheses</text>
<text class="body" x="528" y="733">Validate schemas and every supporting citation</text>
<text class="body" x="528" y="756">Supervised process; persist report to PostgreSQL</text>
<rect x="980" y="630" width="420" height="145" rx="12" fill="#fff" stroke="#cbbddf"/>
<text class="heading" x="998" y="660">Recovery and reconciliation</text>
<text class="body" x="998" y="687">Sweep due/stalled ledger work</text>
<text class="body" x="998" y="710">Inspect receipts before repeating an operation</text>
<text class="body" x="998" y="733">Finalize known effects; escalate uncertain state</text>
<text class="body" x="998" y="756">Simulator receipt contract bounds idempotency</text>
