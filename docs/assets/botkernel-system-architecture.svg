<text class="body" x="1118" y="407">Serialize logical action execution</text>
<text class="body" x="1118" y="430">Commit simulator state + receipt</text>
<text class="body" x="1118" y="453">Finalize ledger + effect + version</text>
<text class="body" x="1118" y="476">Replay-safe simulator execution</text>
