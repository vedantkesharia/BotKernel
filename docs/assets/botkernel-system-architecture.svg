<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">BotKernel system architecture</title><desc id="desc">Independent reasoning, authenticated admission, durable PostgreSQL and Kafka execution, deterministic collective control and read-only investigation.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#ddd8e8"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74648c"/></marker></defs><rect width="1440" height="1000" fill="#fcfbfe"/><rect width="1440" height="1000" fill="url(#dots)"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#262032}.title{font-size:38px;font-weight:700}.heading{font-size:18px;font-weight:700}.body{font-size:15px}.section{font-size:12px;letter-spacing:2px;fill:#7950aa}.edge{fill:none;stroke:#74648c;stroke-width:1.8;marker-end:url(#arrow)}.optional{stroke-dasharray:5 5}</style>
<text class="title" x="40" y="64">BotKernel</text><text class="body" x="270" y="60">Independent reasoning · Durable execution · Collective stability</text>
<text class="section" x="40" y="116">REASONING AND OPERATOR EXPERIENCE</text>
