<text class="body" x="1098" y="197">Advisory heartbeats + decisions</text>
<text class="body" x="1098" y="220">Atomic inference-budget reservations</text>
<text class="body" x="1098" y="243">Budget unavailable → deny inference</text>
<path class="edge optional" d="M350 205H396"/>

<rect x="40" y="350" width="210" height="155" rx="12" fill="#fff" stroke="#cbbddf"/>
<text class="heading" x="58" y="380">FastAPI admission</text>
<text class="body" x="58" y="407">Identity + policy + holds</text>
<text class="body" x="58" y="430">Quota + reservations</text>
<text class="body" x="58" y="453">Version + idempotency</text>
<text class="body" x="58" y="476">Atomic action/outbox write</text>
<rect x="290" y="350" width="300" height="155" rx="12" fill="#fff" stroke="#cbbddf"/>
<text class="heading" x="308" y="380">PostgreSQL</text>
<text class="body" x="308" y="407">Actions · reservations · outbox</text>
<text class="body" x="308" y="430">Simulator state + durable receipts</text>
<text class="body" x="308" y="453">Committed effects + versions</text>
<text class="body" x="308" y="476">Incidents + validated reports</text>
<rect x="630" y="350" width="200" height="155" rx="12" fill="#fff" stroke="#cbbddf"/>
<text class="heading" x="648" y="380">Outbox publisher</text>
<text class="body" x="648" y="407">Separate process</text>
<text class="body" x="648" y="430">Lock unpublished rows</text>
<text class="body" x="648" y="453">Kafka ACK → mark sent</text>
<text class="body" x="648" y="476">Crash window can replay</text>
<rect x="870" y="350" width="190" height="155" rx="12" fill="#fff" stroke="#cbbddf"/>
