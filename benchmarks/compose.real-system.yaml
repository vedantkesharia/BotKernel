services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: botkernel
      POSTGRES_PASSWORD: local
      POSTGRES_DB: bk_benchmark
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botkernel -d bk_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka-init:
    image: apache/kafka:3.9.0
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/data"]
    volumes: [kafka_data:/data]
  kafka:
    image: apache/kafka:3.9.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes: [kafka_data:/tmp/kraft-combined-logs]
    environment:
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  init: &app
    build:
      context: ..
    environment: &env
      DATABASE_URL: postgresql+psycopg://botkernel:local@postgres/bk_benchmark
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: benchmark_actions
      REDIS_URL: redis://redis:6379
      CLOUD_MODE: mock
      AWS_DEPLOY_ALLOWED: "false"
      BEDROCK_ENABLED: "false"
      BEDROCK_SPEND_AUTHORIZED: "false"
      AI_ACTION_EXECUTION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-c", "from botkernel.core import initialize; initialize()"]
  redis:
    image: redis:7-alpine
  api:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["uvicorn", "botkernel.api:app", "--host", "0.0.0.0"]
  publisher:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *env
      ROLE: publisher
    command: ["python", "-m", "botkernel.worker"]
  worker:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *env
      ROLE: worker
    command: ["python", "-m", "botkernel.worker"]
  benchmark:
    <<: *app
    profiles: [benchmark]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *env
      BOTKERNEL_BENCHMARK_OWNED: "true"
    volumes:
      - ./results/real-system:/results
    command: ["python", "-m", "botkernel.real_benchmark"]
volumes:
  postgres_data:
  kafka_data:
