[project]
name = "botkernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client==0.21.1", "langgraph==0.6.11", "langgraph-checkpoint-sqlite==2.0.11",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "confluent-kafka>=2.6,<3",
    "redis>=5,<7",
    "httpx>=0.27,<1",
    "boto3>=1.35,<2",
    "pytest>=8,<9",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["botkernel*"]
