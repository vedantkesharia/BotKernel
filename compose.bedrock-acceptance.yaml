services:
  postgres:
    ports:
      - "127.0.0.1:${BEDROCK_ACCEPTANCE_PG_PORT:-15432}:5432"

  redis:
    ports:
      - "127.0.0.1:${BEDROCK_ACCEPTANCE_REDIS_PORT:-16379}:6379"

  kafka:
    environment:
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${BEDROCK_ACCEPTANCE_KAFKA_PORT:-19092}"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
    ports:
      - "127.0.0.1:${BEDROCK_ACCEPTANCE_KAFKA_PORT:-19092}:19094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 8s
      retries: 24
      start_period: 30s

  init:
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
